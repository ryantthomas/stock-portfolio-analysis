version: 2

models:
  - name: stg_prices
    description: Deduplicated daily adjusted closes, most recent load wins.
    columns:
      - name: ticker
        tests: [not_null]
      - name: price_date
        tests: [not_null]
      - name: adj_close
        tests: [not_null]

  - name: stg_securities
    description: Security metadata with blanks normalized to 'Unknown'.
    columns:
      - name: ticker
        tests: [not_null, unique]
      - name: asset_class
        tests: [not_null]
      - name: is_defensive
        description: True for bonds, cash and commodities.
        tests: [not_null]

  - name: stg_portfolio_holdings
    description: Portfolio snapshots with weights renormalized to sum to 1.
    columns:
      - name: portfolio_id
        tests: [not_null]
      - name: ticker
        tests: [not_null]
      - name: weight
        tests: [not_null]
