[project]
name = "portfolio-api"
version = "0.1.0"
description = "Portfolio analytics API: market data ingestion, risk/diversification analytics, DuckDB + dbt warehouse"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "duckdb>=0.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Market data providers. Install what you want; the provider chain degrades gracefully.
yfinance = ["yfinance>=0.2.40"]
openbb = ["openbb>=4.3.0"]
dbt = ["dbt-core>=1.8", "dbt-duckdb>=1.8"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The reference universe is a data table: one security per line stays far more
# readable than wrapping each record across four lines.
"app/reference.py" = ["E501"]
