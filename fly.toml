# Fly.io. Create the app once with `fly launch --no-deploy`, then `fly deploy`.
app = "portfolio-analysis"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTFOLIO_PROVIDER = "auto"
  PORTFOLIO_ENABLE_WAREHOUSE_API = "false"
  PORTFOLIO_PERSIST_PORTFOLIOS = "false"
  PORTFOLIO_RATE_LIMIT_PER_MINUTE = "30"
  PORTFOLIO_DUCKDB_PATH = "/data/warehouse.duckdb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero when idle. Note the rate limiter is per-process, so running
  # more than one machine multiplies the effective limit.
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = false

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

# Optional persistent price cache. Remove this and PORTFOLIO_DUCKDB_PATH above
# to run fully stateless.
[[mounts]]
  source = "warehouse"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
